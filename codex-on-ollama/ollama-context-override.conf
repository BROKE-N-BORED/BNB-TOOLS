# Systemd override for the Ollama service (BNB-TOOLS T29).
# Raises the server context length so Codex has room to work.
# Codex needs 64K tokens or more. On 8 GB RAM, 64K may swap; if
# it does, drop the number to 32768 and restart the service.
# Below 64K Codex may truncate or complain.
# Install with: sudo cp this file to
# /etc/systemd/system/ollama.service.d/override.conf, then
# sudo systemctl daemon-reload and sudo systemctl restart ollama.
[Service]
Environment="OLLAMA_CONTEXT_LENGTH=65536"
