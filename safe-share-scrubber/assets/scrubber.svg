<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Safe Share Scrubber</title>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#23262b" stroke="#3a3e44" stroke-width="4"/>
  <!-- shield: the file is protected before it is shared -->
  <path d="M128 36 L202 70 V130 C202 180 170 210 128 226 C86 210 54 180 54 130 V70 Z" fill="#e8a33d"/>
  <!-- checkmark: the secrets are caught -->
  <path d="M92 130 L120 158 L166 102" fill="none" stroke="#23262b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
